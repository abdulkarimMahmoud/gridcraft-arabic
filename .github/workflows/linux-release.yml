name: Build & Release Linux (Debian, Ubuntu .deb, AppImage, RPM)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev zsync

      - name: Install nfpm (Packaging tool for .deb and .rpm)
        run: |
          echo "Installing nfpm..."
          NFPM_VERSION="2.41.2"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Linux Packaging Script (DEB, AppImage, RPM, Tar)
        run: |
          chmod +x packaging/linux/package.sh
          ./packaging/linux/package.sh --formats "deb rpm tar"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gridcraft-linux-x86_64
          path: dist/release/*

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.16.0-arabic
          name: GridCraft Arabic Release v0.16.0
          draft: false
          prerelease: false
          files: dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
