name: Build & Release Windows (MSI & Portable)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WiX Toolset v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Run Windows Packaging Script
        shell: pwsh
        run: |
          .\packaging\windows\package.ps1 -Arch x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gridcraft-windows-x64
          path: dist/release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.1.0-arabic' }}
          name: GridCraft Arabic Release ${{ github.ref_name || 'v0.1.0' }}
          draft: false
          prerelease: false
          files: dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
